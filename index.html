<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="VizPlay – alle Bildschirme zentral steuern.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27m9 6 9 6-9 6z%27 fill=%27white%27/%3E%3C/svg%3E">
<title>VizPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Bewusst dark-only: Markenwelt des VizPlay-Dashboards (Zinc + Indigo) */
:root{
  --bg:#09090b; --panel:#111114; --panel2:#18181b; --line:#27272a; --line2:#3f3f46;
  --fg:#fafafa; --muted:#a1a1aa; --dim:#71717a;
  --accent:#818cf8; --accent-strong:#4f46e5;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[dir="rtl"]{--sans:"IBM Plex Sans Arabic","Geist",ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
@media (max-width:560px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.12}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{letter-spacing:0;line-height:1.35}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.lead{color:var(--muted);font-size:19px;max-width:60ch}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(9,9,11,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent-strong);display:grid;place-items:center}
.logo svg{width:14px;height:14px;fill:#fff}
.langs{margin-inline-start:auto;display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:8px}
.langs button{font:500 13px var(--sans);color:var(--muted);background:none;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}
.langs button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section{padding-block:96px;border-bottom:1px solid var(--line)}
@media (max-width:560px){section{padding-block:64px}}
.head{display:grid;gap:14px;margin-bottom:48px;max-width:760px}
.head h2{font-size:clamp(30px,4.4vw,46px)}

/* Hero */
.hero{padding-block:80px 96px}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:48px}}
.hero h1{font-size:clamp(40px,6.2vw,72px);font-weight:600;margin-block:16px 22px}
.hero h1 em{font-style:normal;color:var(--accent)}
.checks{display:grid;gap:10px;margin:28px 0 0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:center;color:var(--fg)}
.checks .i{color:var(--ok);width:20px;height:20px}

.tv{background:#000;border:12px solid #1c1c1f;border-radius:16px;aspect-ratio:16/9;position:relative;overflow:hidden;max-width:100%;box-shadow:0 40px 100px -40px rgba(79,70,229,.6)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:26px;opacity:0}
.slide.on{opacity:1}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.slide{isolation:isolate;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.slide::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 60%)}
.slide b{font-size:clamp(20px,3vw,34px);font-weight:600;line-height:1.15}
.slide small{font-size:13px;opacity:.8}
.s1{background:radial-gradient(120% 90% at 20% 10%,#4338ca 0,#1e1b4b 55%,#0b0a1f 100%)}
.s2{background:linear-gradient(135deg,#0f766e,#022c22)}
.s3{background:radial-gradient(90% 90% at 80% 20%,#c2410c,#3b1d06 70%)}
.s4{background:linear-gradient(160deg,#be123c,#4c0519)}
.prog{position:absolute;inset-inline-start:0;bottom:0;height:4px;background:#fff;opacity:.8;width:0}
.stand{width:28%;height:14px;margin:0 auto;background:#1c1c1f;border-radius:0 0 8px 8px}
.tv-cap{text-align:center;margin-top:18px;font-size:14px;color:var(--dim)}

/* Problem */
.pains{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.pains{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pains{grid-template-columns:1fr}}
.pain{padding:24px;border:1px solid var(--line);border-radius:12px;display:grid;gap:10px;align-content:start}
.pain .i{color:var(--dim)}
.pain h3{font-size:18px;font-weight:600}
.pain p{color:var(--muted);font-size:15px}
.answer{margin-top:28px;padding:22px 26px;border-radius:12px;background:var(--accent-strong);font-size:19px;font-weight:500;display:flex;gap:14px;align-items:center}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
.step .vis{aspect-ratio:16/10;background:var(--panel2);border-bottom:1px solid var(--line);padding:22px;display:grid;place-items:center}
.step .txt{padding:22px 24px 26px;display:grid;gap:8px;align-content:start}
.step .n{font-size:13px;font-weight:600;color:var(--accent)}
.step h3{font-size:21px;font-weight:600}
.step p{color:var(--muted);font-size:15px}
.mock{width:100%;max-width:280px;display:grid;gap:8px}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:6px;justify-items:center}
.thumbs{display:flex;gap:6px}
.thumbs i{flex:1;height:34px;border-radius:5px}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.row i{width:28px;height:18px;border-radius:3px;flex:none}
.row span{flex:1}
.row small{color:var(--dim)}
.screens{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:280px}
.scr{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:var(--bg);display:grid;gap:6px}
.scr i{display:block;aspect-ratio:16/9;border-radius:4px;background:#1f1f23}
.scr.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scr.sel i{background:linear-gradient(135deg,#4338ca,#1e1b4b)}

/* App-Demo */
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:30px;padding:14px 22px;border-radius:10px;background:var(--accent-strong);color:#fff;font:600 16px var(--sans);text-decoration:none;box-shadow:0 12px 30px -12px rgba(79,70,229,.9)}
.cta:hover{background:#5b52f0}
.cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cta .i{width:18px;height:18px}
[dir="rtl"] .cta .i,[dir="rtl"] .answer .i{transform:scaleX(-1)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border:1px solid rgba(129,140,248,.35);background:rgba(79,70,229,.1);border-radius:10px;margin-bottom:16px;font-size:15px}
.tip .i{color:var(--accent);width:18px;height:18px;margin-top:3px}
.app{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 40px 90px -50px rgba(79,70,229,.7)}
.app:fullscreen{border-radius:0;display:flex;flex-direction:column}
.app:fullscreen .app-body{flex:1;height:auto}
.app-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.app-bar i{width:11px;height:11px;border-radius:50%;background:#3f3f46}
.app-bar .ttl{margin-inline-start:8px;font-size:13px;color:var(--muted)}
.app-bar .sp{margin-inline-start:auto;display:flex;gap:6px}
.btn{font:500 13px var(--sans);border-radius:8px;padding:7px 12px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#222226}
.btn:focus-visible,.navb:focus-visible,.sel:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .i{width:15px;height:15px}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.primary:hover{background:#5b52f0}
.btn.danger{background:#7f1d1d;border-color:#991b1b}
.btn.danger:hover{background:#991b1b}
.app-frame{display:block;width:100%;height:min(820px,85vh);border:0;background:#09090b}
@media (max-width:760px){.app-frame{height:760px}}
.app-bar .btn{text-decoration:none}

/* Benefits */
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (max-width:900px){.benefits{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.benefits{grid-template-columns:1fr}}
.ben{background:var(--bg);padding:28px;display:grid;gap:10px;align-content:start}
.ben .i{color:var(--accent)}
.ben h3{font-size:18px;font-weight:600}
.ben p{color:var(--muted);font-size:15px}

/* Hardware */
.hw{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.hw{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;padding:30px;background:var(--panel);display:grid;gap:12px;align-content:start}
.card .tag{justify-self:start;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(129,140,248,.14);color:var(--accent)}
.card h3{font-size:24px;font-weight:600}
.card p{color:var(--muted)}

/* Smart-TV */
.tvsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.tvsteps{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.tvsteps{grid-template-columns:1fr}}
.tvstep{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--panel);display:grid;gap:8px;align-content:start}
.tvstep .n{width:30px;height:30px;border-radius:50%;background:var(--accent-strong);display:grid;place-items:center;font-weight:600;font-size:14px}
.tvstep h3{font-size:18px;font-weight:600}
.tvstep p{color:var(--muted);font-size:15px}
.who{font-size:12px;font-weight:600;color:var(--accent)}
.faq{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.faq{grid-template-columns:1fr}}
.qa{border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:grid;gap:8px}
.qa h3{font-size:17px;font-weight:600;display:flex;gap:10px;align-items:center}
.qa h3 .i{color:var(--accent);width:20px;height:20px}
.qa p{color:var(--muted);font-size:15px}
.note{margin-top:16px;font-size:14px;color:var(--dim)}
/* Use cases */
.uses{display:flex;flex-wrap:wrap;gap:12px}
.use{display:flex;align-items:center;gap:12px;padding:14px 20px;border:1px solid var(--line);border-radius:999px;font-weight:500}
.use .i{color:var(--accent);width:20px;height:20px}

/* References */
.refs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.refs{grid-template-columns:1fr}}
.ref{border:1px solid var(--line);border-radius:14px;padding:30px;display:grid;gap:16px;background:linear-gradient(180deg,var(--panel),var(--bg))}
.ref .top{display:flex;align-items:center;gap:14px}
.ref .mark{width:48px;height:48px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent)}
.ref h3{font-size:22px;font-weight:600}
.ref .kind{color:var(--dim);font-size:14px}
.ref p{color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--fg)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ok)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* Compare */
.cmp-wrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.cmp{width:100%;min-width:560px;border-collapse:collapse}
.cmp th,.cmp td{text-align:start;padding:16px 22px;border-bottom:1px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-weight:600;background:var(--panel2);font-size:15px}
.cmp th.us{color:var(--accent)}
.cmp td:first-child{color:var(--muted)}
.cmp .y{color:var(--ok);font-weight:600}
.cmp .n{color:var(--dim)}

/* Close */
.close{text-align:center;display:grid;gap:22px;justify-items:center}
.close h2{font-size:clamp(32px,5vw,54px);max-width:18ch}
.close .lead{margin-inline:auto}
.sum{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.sum span{padding:10px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:500}
footer{padding-block:36px;color:var(--dim);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>

(() => {
  let lang = DEFAULT_LANG;
  try { const q = new URLSearchParams(location.search).get("lang"); if (I18N[q]) lang = q; } catch (e) {}
  const t = (k, v) => { let x = I18N[lang][k] ?? I18N.de[k] ?? k; if (v) for (const n in v) x = x.replace("{" + n + "}", v[n]); return x; };
  const apply = () => {
    const root = document.documentElement;
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  };
  document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; apply(); }));
  apply();

  // TV-Demo im Hero: hartes Umschalten, nie schwarz
  const slides = [...document.querySelectorAll("#tv .slide")], prog = document.getElementById("prog");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, dur = 3500;
  let cur = 0;
  const run = () => { if (reduce) return; prog.style.transition = "none"; prog.style.width = "0"; void prog.offsetWidth; prog.style.transition = "width " + dur + "ms linear"; prog.style.width = "100%"; };
  run();
  const play = () => slides.forEach((sl, i) => { const v = sl.querySelector("video"); if (!v) return; if (i === cur) { v.currentTime = 0; v.play().catch(() => {}); } else v.pause(); });
  play();
  setInterval(() => { slides[cur].classList.remove("on"); cur = (cur + 1) % slides.length; slides[cur].classList.add("on"); play(); run(); }, dur);
})();
</script>
